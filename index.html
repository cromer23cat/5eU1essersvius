<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

      100% { transform: scale(1); opacity: 1; }

  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between text-slate-800 antialiased selection:bg-amber-200">

  <!-- Header -->
  <header class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white py-5 px-4 shadow-lg text-center relative">
    <div class="max-w-3xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="text-left">
        <span class="bg-indigo-500/60 border border-indigo-300/30 text-indigo-100 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider inline-block">
          📚 Coneixement del Medi • 5è de Primària
        </span>
        <h1 class="text-2xl sm:text-3xl font-fredoka font-bold tracking-wide mt-1">

      <!-- Toggle Sound Button -->
      <button id="soundToggle" onclick="toggleSound()" class="bg-indigo-500/40 hover:bg-indigo-500/70 border border-indigo-300/30 text-white px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition flex items-center gap-1.5">
        <span id="soundIcon">🔊</span> So actiu
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-grow flex items-center justify-center p-3 sm:p-6">
    <div id="app" class="w-full max-w-2xl bg-white rounded-3xl shadow-xl p-5 sm:p-8 border border-slate-200 min-h-[460px] flex flex-col justify-between transition-all">
      <!-- Dynamic Content rendered by JavaScript -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-4 text-xs text-slate-500">
    🟢 100% Adaptat per a l'alumnat de 10 anys • Generador de proves per nivells
  </footer>

  <script>
    // Web Audio Synthesizer per a efectes de so sencills sense fitxers externs
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }
      playCorrect() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      }
      playWrong() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now); // A3
        osc.frequency.setValueAtTime(180, now + 0.15);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      }
      playClick() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      }
    }

    const sound = new SoundEngine();

    function toggleSound() {
      sound.enabled = !sound.enabled;
      const soundToggleBtn = document.getElementById('soundToggle');
      if (sound.enabled) {
        soundToggleBtn.innerHTML = '<span>🔊</span> So actiu';
        sound.playClick();
      } else {
        soundToggleBtn.innerHTML = '<span>🔇</span> So en silenci';
      }
    }

    // BANCS DE PREGUNTES DIVIDITS PER NIVELLS DE DIFICULTAT

    // NIVELL 1: BÀSIC (Llenguatge planer, conceptes clau directes, ideal per a 10 anys)
    const level1Questions = [
      {
        question: "Quines són les 3 funcions vitals que fan TOTS els éssers vius?",
        hint: "Pensa en menjar, adonar-se de les coses i tenir descendència.",
        options: [
          "Nutrició, Relació i Reproducció",
          "Menjar, Córrer i Dormir",
          "Nàixer, Creixir i Volar",
          "Respirar, Caminar i Veure"
        ],
        correctIndex: 0,
        explanation: "Molt bé! Tots els éssers vius fan aquestes tres funcions fonamentals: es demanen aliment (nutrició), reaccionen a l'ambient (relació) i tenen fills o descendents (reproducció)."
      },
      {
        question: "Quina part de la cèl·lula actua com el 'cervell' que ho controla tot?",
        hint: "Sol estar al centre de la cèl·lula i guarda tota la informació.",
        options: [
          "El nucli",
          "La membrana",
          "El citoplasma",
          "La paret cel·lular"
        ],
        correctIndex: 0,
        explanation: "Correcte! El nucli és l'encarregat de dirigir tot el funcionament de la cèl·lula."
      },
      {
        question: "Com s'anomenen els éssers vius que fabriquen el seu propi aliment (com les plantes)?",
        hint: "Comença per 'Auto-'.",
        options: [
          "Autòtrofs",
          "Heteròtrofs",
          "Carnívors",
          "Herbívors"
        ],
        correctIndex: 0,
        explanation: "Exacte! Els éssers autòtrofs (com les plantes i les algues) no necessiten menjar altres éssers vius, sinó que fabriquen l'aliment ells mateixos amb la llum del sol."
      },
      {
        question: "I els éssers vius que han de MENJAR altres éssers vius per alimentar-se (com els animals)?",
        hint: "Comença per 'Hetero-'.",
        options: [
          "Heteròtrofs",
          "Autòtrofs",
          "Vegetals",
          "Productors"
        ],
        correctIndex: 0,
        explanation: "Molt bé! Els heteròtrofs (animals, fongs i molts bacteris) s'alimenten d'altres organismes."
      },
      {
        question: "Quina característica especial tenen les cèl·lules de les plantes que NO tenen els animals?",
        hint: "Les fa ser de color verd i els permet fer la fotosíntesi.",
        options: [
          "Cloroplasts i paret cel·lular rígida",
          "Nucli i sang",
          "Potes i ulls",
          "Només aigua"
        ],
        correctIndex: 0,
        explanation: "Genial! Les cèl·lules vegetals tenen cloroplasts (verds) i una paret rígida que els dóna suport."
      },
      {
        question: "A quin regne pertany un bolet com el pinetell o el xampinyó?",
        hint: "No és ni una planta ni un animal!",
        options: [
          "Regne dels Fongs",
          "Regne de les Plantes",
          "Regne dels Animals",
          "Regne de les Moneres"
        ],
        correctIndex: 0,
        explanation: "Correcte! Els bolets i els llevats pertanyen al Regne dels Fongs."
      },
      {
        question: "Quin d'aquests regnes està format per organismes MÉS SENZILLS i petits (bacteris)?",
        hint: "Són microscòpics i unicel·lulars.",
        options: [
          "Regne de les Moneres",
          "Regne dels Animals",
          "Regne de les Plantes",
          "Regne dels Fongs"
        ],
        correctIndex: 0,
        explanation: "Fantàstic! El regne de les Moneres inclou tots els bacteris, que són els éssers més simples del planeta."
      },
      {
        question: "Si juntem moltes cèl·lules iguals que fan la mateixa feina, quin nivell formen?",
        hint: "Per exemple: el teixit muscular.",
        options: [
          "Un teixit",
          "Un òrgan",
          "Un aparell",
          "Un organisme complet"
        ],
        correctIndex: 0,
        explanation: "Ben fet! Les cèl·lules iguals s'agrupen per formar teixits."
      },
      {
        question: "Quin d'aquests elements és un ÒRGAN del cos humà?",
        hint: "Un òrgan està format per diferents teixits (com el cor o l'estómac).",
        options: [
          "El cor",
          "Una gota de sang",
          "Una cèl·lula muscular",
          "Tot el cos humà"
        ],
        correctIndex: 0,
        explanation: "Super! El cor, l'estómac, el cervell o els pulmons són Òrgans."
      },
      {
        question: "Quan un gira-sol es gira buscant la llum del sol, quina funció vital fa?",
        hint: "Està reaccionant a un canvi de l'entorn.",
        options: [
          "Funció de Relació",
          "Funció de Nutrició",
          "Funció de Reproducció",
          "Funció de Digestió"
        ],
        correctIndex: 0,
        explanation: "Molt bé! La funció de relació permet captar informació del medi (com la llum) i reaccionar."
      },
      {
        question: "Com s'anomenen els éssers vius que estan formats per UNA SOLA cèl·lula?",
        hint: "Uni- significa 'un sol'.",
        options: [
          "Unicel·lulars",
          "Pluricel·lulars",
          "Gigants",
          "Complexos"
        ],
        correctIndex: 0,
        explanation: "Exacte! Unicel·lulars vol dir que tenen una única cèl·lula (com els bacteris)."
      },
      {
        question: "I els éssers vius formats per MILIONS de cèl·lules (com nosaltres o un arbre)?",
        hint: "Pluri- significa 'molts'.",
        options: [
          "Pluricel·lulars",
          "Unicel·lulars",
          "Invisibles",
          "Simples"
        ],
        correctIndex: 0,
        explanation: "Molt bé! Els éssers pluricel·lulars estan formats per moltes cèl·lules coordinades."
      }
    ];

    // NIVELL 2: AVANÇAT (Més detallat, per a qui vol un repte)
    const level2Questions = [
      {
        question: "La maduixera crea tiges horitzontals (estolons) que toquen terra i creen noves plantes idèntiques. Quin tipus de reproducció és?",
        hint: "Sols intervé una sola planta mare.",
        options: [
          "Reproducció asexual",
          "Reproducció sexual",
          "Funció de relació",
          "Nutrició autòtrofa"
        ],
        correctIndex: 0,
        explanation: "Molt bé! És reproducció asexual perquè una sola planta mare origina noves plantes filles exactament iguals."
      },
      {
        question: "A quin regne pertanyen tant les algues (autòtrofes) com els protozous (heteròtrofs)?",
        hint: "No són ni animals, ni plantes, ni fongs, ni bacteris.",
        options: [
          "Regne dels Protoctistes",
          "Regne dels Fongs",
          "Regne de les Moneres",
          "Regne dels Animals"
        ],
        correctIndex: 0,
        explanation: "Excel·lent! El regne dels Protoctistes inclou les algues i els protozous (com les amebes)."
      },
      {
        question: "Quin és l'ORDRE CORRECTE dels nivells d'organització, del MÉS SENZILL al MÉS COMPLEX?",
        hint: "Comença per la cèl·lula i acaba en l'organisme complet.",
        options: [
          "Cèl·lula → Teixit → Òrgan → Aparell / Sistema → Organisme",
          "Organisme → Aparell → Òrgan → Teixit → Cèl·lula",
          "Cèl·lula → Òrgan → Teixit → Aparell → Organisme",
          "Teixit → Cèl·lula → Aparell → Òrgan → Organisme"
        ],
        correctIndex: 0,
        explanation: "Perfecte! Cèl·lules → Teixits → Òrgans → Aparells/Sistemes → Organisme."
      },
      {
        question: "Per què els fongs NO es troben al regne de les plantes?",
        hint: "Pensa en com aconsegueixen l'aliment.",
        options: [
          "Perquè són heteròtrofs i no poden fer la fotosíntesi",
          "Perquè poden caminar i desplaçar-se",
          "Perquè no tenen cèl·lules",
          "Perquè són tots invisibles a ull nu"
        ],
        correctIndex: 0,
        explanation: "Molt bona observació! Els fongs NO són plantes perquè no tenen clorofil·la i no poden fabricar el seu aliment (són heteròtrofs)."
      },
      {
        question: "Quina és la funció de la membrana plasmàtica d'una cèl·lula?",
        hint: "És la 'fusta' o 'envoltura' exterior de la cèl·lula.",
        options: [
          "Envoltar la cèl·lula i controlar què entra i què surt",
          "Fabricar menjar mitjançant el sol",
          "Guardar el DNA i donar ordres",
          "Navegar pel cos"
        ],
        correctIndex: 0,
        explanation: "Correcte! La membrana envolta la cèl·lula i actua com una frontera de seguretat."
      },
      {
        question: "Observes una cèl·lula al microscopi: té forma d'hexàgon o prisma, paret dura i és de color verd. De quin tipus és?",
        hint: "El color verd ve dels cloroplasts.",
        options: [
          "Una cèl·lula vegetal",
          "Una cèl·lula animal",
          "Un bacteri",
          "Un virus"
        ],
        correctIndex: 0,
        explanation: "Molt bé! Té la forma geomètrica i el color verd típic d'una cèl·lula vegetal."
      },
      {
        question: "L'aparell digestiu està format per l'estómac, els intestins i la boca. A quin nivell d'organització correspon l'Aparell Digestiu?",
        hint: "És la unió de diversos òrgans treballant junts.",
        options: [
          "Aparell o Sistema",
          "Òrgan",
          "Teixit",
          "Cèl·lula"
        ],
        correctIndex: 0,
        explanation: "Exacte! Un conjunt d'òrgans coordinats formen un Aparell o Sistema."
      },
      {
        question: "Quina d'aquestes opcions descriu una activitat de la funció de NUTRICIÓ?",
        hint: "No només és menjar: també inclou respirar i expulsar rebuigs.",
        options: [
          "Aconseguir oxigen i nutrients per obtenir energia",
          "Fugir corrent quan un depredador s'acosta",
          "Tenir criatures a la primavera",
          "Tancar les fulles quan plou"
        ],
        correctIndex: 0,
        explanation: "Correcte! La nutrició inclou la digestió, la respiració, la circulació i l'excreció."
      }
    ];

    // ESTAT DE L'APLICACIÓ
    let currentLevel = 1; // 1: Bàsic, 2: Avançat
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let streak = 0;
    let selectedOption = null;
    let answered = false;
    let hintShown = false;

    const appContainer = document.getElementById('app');

    // Funció Fisher-Yates per barrejar arrays
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Pantalla de Selecció de Nivell
    function renderLevelSelection() {
      appContainer.innerHTML = `
        <div class="text-center py-4 my-auto animate-pop">
          <div class="inline-flex items-center justify-center p-3 bg-indigo-100 text-indigo-600 rounded-2xl mb-4 text-3xl">
            🎯
          </div>
          <h2 class="text-2xl sm:text-3xl font-fredoka font-bold text-slate-800 mb-2">Tria el teu nivell de repàs</h2>
          <p class="text-slate-600 text-sm sm:text-base max-w-md mx-auto mb-8">
            Selecciona com vols practicar avui. Pots canviar de nivell quan vulguis!
          </p>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-lg mx-auto">
            <!-- Level 1 Button -->
            <button onclick="startQuizWithLevel(1)" class="group bg-gradient-to-br from-emerald-50 to-teal-100 hover:from-emerald-100 hover:to-teal-200 border-2 border-emerald-300 rounded-2xl p-5 text-left transition transform hover:-translate-y-1 shadow-sm hover:shadow-md flex flex-col justify-between cursor-pointer">
              <div>
                <div class="flex justify-between items-center mb-2">
                  <span class="text-2xl">🌱</span>
                  <span class="bg-emerald-600 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">Nivell 1</span>
                </div>
                <h3 class="text-lg font-fredoka font-bold text-emerald-900 mb-1">Inicial / Bàsic</h3>
                <p class="text-xs text-emerald-700 leading-relaxed">
                  Preguntes clares i senzilles. Ideal per assegurar els conceptes principals! Inclou pistes 💡.
                </p>
              </div>
              <div class="mt-4 text-xs font-bold text-emerald-800 group-hover:translate-x-1 transition flex items-center gap-1">
                Començar Nivell 1 →
              </div>
            </button>

            <!-- Level 2 Button -->
            <button onclick="startQuizWithLevel(2)" class="group bg-gradient-to-br from-indigo-50 to-purple-100 hover:from-indigo-100 hover:to-purple-200 border-2 border-indigo-300 rounded-2xl p-5 text-left transition transform hover:-translate-y-1 shadow-sm hover:shadow-md flex flex-col justify-between cursor-pointer">
              <div>
                <div class="flex justify-between items-center mb-2">
                  <span class="text-2xl">🚀</span>
                  <span class="bg-indigo-600 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">Nivell 2</span>
                </div>
                <h3 class="text-lg font-fredoka font-bold text-indigo-900 mb-1">Avançat / Repte</h3>
                <p class="text-xs text-indigo-700 leading-relaxed">
                  Per a alumnes que volen anar un pas més enllà. Preguntes de reflexió i classificació!
                </p>
              </div>
              <div class="mt-4 text-xs font-bold text-indigo-800 group-hover:translate-x-1 transition flex items-center gap-1">
                Començar Repte →
              </div>
            </button>
          </div>
        </div>
      `;
    }

    // Iniciar el Quiz amb el nivell triat
    function startQuizWithLevel(level) {
      sound.playClick();
      currentLevel = level;
      const bank = level === 1 ? level1Questions : level2Questions;
      
      // Triar fins a 8 o 10 preguntes a l'atzar del banc seleccionat
      const shuffledBank = shuffle(bank);
      const selected = shuffledBank.slice(0, Math.min(8, shuffledBank.length));

      currentQuestions = selected.map(q => {
        const rawOptions = q.options.map((opt, idx) => ({
          text: opt,
          isCorrect: idx === q.correctIndex
        }));
        return {
          question: q.question,
          hint: q.hint || "Pensa bé quina opció té més sentit!",
          options: shuffle(rawOptions),
          explanation: q.explanation
        };
      });

      currentIndex = 0;
      score = 0;
      streak = 0;
      selectedOption = null;
      answered = false;
      hintShown = false;

      renderQuestion();
    }

    // Mostrar Pista
    function toggleHint() {
      sound.playClick();
      hintShown = !hintShown;
      const hintBox = document.getElementById('hintBox');
      if (hintBox) {
        hintBox.classList.toggle('hidden');
      }
    }

    // Renderitzar Pregunta Actual
    function renderQuestion() {
      const q = currentQuestions[currentIndex];
      const progressPercent = ((currentIndex + 1) / currentQuestions.length) * 100;
      const levelBadge = currentLevel === 1 
        ? '<span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-full border border-emerald-300">🌱 Nivell 1: Bàsic</span>'
        : '<span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-2.5 py-1 rounded-full border border-indigo-300">🚀 Nivell 2: Avançat</span>';

      appContainer.innerHTML = `
        <div class="animate-pop">
          <!-- Top Bar Info -->
          <div class="flex flex-wrap justify-between items-center gap-2 mb-4">
            ${levelBadge}
            <div class="flex items-center gap-3 text-xs font-bold text-slate-500">
              ${streak > 1 ? `<span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full border border-amber-300">🔥 Ratxa: ${streak}</span>` : ''}
              <span>Encerts: ${score} / ${currentQuestions.length}</span>
            </div>
          </div>

          <!-- Progress Bar -->
          <div class="w-full bg-slate-100 rounded-full h-2.5 mb-6 overflow-hidden border border-slate-200">
            <div class="bg-gradient-to-r from-indigo-500 to-violet-600 h-2.5 rounded-full transition-all duration-300" style="width: ${progressPercent}%"></div>
          </div>

          <!-- Question Header & Text -->
          <div class="mb-5">
            <div class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">
              Pregunta ${currentIndex + 1} de ${currentQuestions.length}
            </div>
            <h2 class="text-lg sm:text-xl font-fredoka font-bold text-slate-800 leading-snug">
              ${q.question}
            </h2>
          </div>

          <!-- Hint Button (Si no s'ha respost encara) -->
          ${!answered ? `
            <div class="mb-4">
              <button onclick="toggleHint()" class="text-xs font-semibold text-amber-600 hover:text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 cursor-pointer">
                <span>💡</span> ${hintShown ? 'Amagar pista' : 'Necessites una pista?'}
              </button>
              <div id="hintBox" class="${hintShown ? '' : 'hidden'} mt-2 p-3 bg-amber-50 border border-amber-200 text-amber-900 rounded-xl text-xs leading-relaxed animate-pop">
                <strong>Pista:</strong> ${q.hint}
              </div>
            </div>
          ` : ''}

          <!-- Options Grid -->
          <div class="space-y-2.5 mb-6">
            ${q.options.map((opt, idx) => {
              let btnStyle = "w-full text-left p-3.5 sm:p-4 rounded-2xl border-2 transition font-medium text-sm sm:text-base flex justify-between items-center ";
              
              if (!answered) {
                btnStyle += "border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 text-slate-700 cursor-pointer active:scale-[0.99]";
              } else {
                if (opt.isCorrect) {
                  btnStyle += "border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold shadow-sm";
                } else if (selectedOption === idx) {
                  btnStyle += "border-rose-400 bg-rose-50 text-rose-900";
                } else {
                  btnStyle += "border-slate-100 bg-slate-50 text-slate-400 opacity-50";
                }
              }

              return `
                <button onclick="handleOptionSelect(${idx})" ${answered ? 'disabled' : ''} class="${btnStyle}">
                  <span>${opt.text}</span>
                  ${answered && opt.isCorrect ? '<span class="text-emerald-600 text-lg font-bold ml-2">✓</span>' : ''}
                  ${answered && selectedOption === idx && !opt.isCorrect ? '<span class="text-rose-500 text-lg font-bold ml-2">✗</span>' : ''}
                </button>
              `;
            }).join('')}
          </div>

          <!-- Explanation Box (S'activa al respondre) -->
          ${answered ? `
            <div class="p-4 rounded-2xl mb-6 text-xs sm:text-sm animate-pop ${q.options[selectedOption].isCorrect ? 'bg-emerald-50 border border-emerald-200 text-emerald-900' : 'bg-rose-50 border border-rose-200 text-rose-900'}">
              <div class="font-bold font-fredoka text-base mb-1 flex items-center gap-1.5">
                ${q.options[selectedOption].isCorrect ? '🎉 Molt bé! Resposta correcta' : '😅 Quasi! La resposta no és aquesta'}
              </div>
              <p class="leading-relaxed opacity-90">${q.explanation}</p>
            </div>
          ` : ''}

          <!-- Footer Buttons -->
          <div class="flex items-center justify-between pt-2 border-t border-slate-100">
            <button onclick="renderLevelSelection()" class="text-xs text-slate-400 hover:text-slate-600 font-medium underline cursor-pointer">
              ← Canviar de nivell
            </button>
            
            ${answered ? `
              <button onclick="nextQuestion()" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-fredoka font-bold text-sm px-6 py-2.5 rounded-xl shadow-md transition flex items-center gap-2 cursor-pointer">
                ${currentIndex < currentQuestions.length - 1 ? 'Següent pregunta →' : 'Veure resultats final 🏆'}
              </button>
            ` : `
              <span class="text-xs text-slate-400 italic">Tria una opció per continuar</span>
            `}
          </div>
        </div>
      `;
    }

    // Seleccionar una opció
    function handleOptionSelect(index) {
      if (answered) return;
      selectedOption = index;
      answered = true;

      const isCorrect = currentQuestions[currentIndex].options[index].isCorrect;
      if (isCorrect) {
        score++;
        streak++;
        sound.playCorrect();
      } else {
        streak = 0;
        sound.playWrong();
      }

      renderQuestion();
    }

    // Avançar pregunta
    function nextQuestion() {
      sound.playClick();
      if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        selectedOption = null;
        answered = false;
        hintShown = false;
        renderQuestion();
      } else {
        renderResults();
      }
    }

    // Pàgina final de resultats
    function renderResults() {
      const total = currentQuestions.length;
      const percentage = Math.round((score / total) * 100);
      
      let title = "";
      let emoji = "";
      let badgeStyle = "";

      if (percentage >= 85) {
        emoji = "🌟";
        title = "Excel·lent feina! Ets un/a autèntic/a expert/a!";
        badgeStyle = "bg-emerald-100 text-emerald-800 border-emerald-300";
      } else if (percentage >= 60) {
        emoji = "👍";
        title = "Molt bé! Has demostrat saber-te bé la unitat.";
        badgeStyle = "bg-blue-100 text-blue-800 border-blue-300";
      } else {
        emoji = "💪";
        title = "Bon intent! Pots repassar un poc més i tornar-ho a provar.";
        badgeStyle = "bg-amber-100 text-amber-800 border-amber-300";
      }

      appContainer.innerHTML = `
        <div class="text-center py-4 my-auto animate-pop">
          <div class="inline-block p-4 rounded-3xl bg-indigo-50 text-indigo-600 mb-3 text-5xl">
            ${emoji}
          </div>
          
          <h2 class="text-2xl sm:text-3xl font-fredoka font-bold text-slate-800 mb-2">
            Resultat final
          </h2>

          <div class="inline-block px-4 py-1.5 rounded-full border ${badgeStyle} font-semibold text-xs sm:text-sm mb-6">
            ${title}
          </div>

          <div class="bg-slate-50 p-6 rounded-3xl border border-slate-200 mb-6 max-w-xs mx-auto shadow-inner">
            <div class="text-5xl font-fredoka font-bold text-indigo-600 mb-1">${score} / ${total}</div>
            <div class="text-slate-500 text-xs font-semibold uppercase tracking-wider">${percentage}% d'encerts</div>
          </div>

          <p class="text-slate-500 text-xs max-w-sm mx-auto mb-6">
            Pots tornar a repassar aquest nivell o provar un altre. Les preguntes es tornaran a barrejar!
          </p>

          <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
            <button onclick="startQuizWithLevel(${currentLevel})" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-fredoka font-bold px-6 py-3 rounded-2xl shadow-md transition cursor-pointer">
              🔄 Repetir aquest nivell
            </button>
            <button onclick="renderLevelSelection()" class="w-full sm:w-auto bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 font-fredoka font-bold px-6 py-3 rounded-2xl transition cursor-pointer">
              🎯 Canviar de nivell
            </button>
          </div>
        </div>
      `;
    }

    // Carregar la pantalla de selecció inicialment
    window.onload = renderLevelSelection;
  </script>
</body>
</html>
